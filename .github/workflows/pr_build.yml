---
name: Pull Request Build, Tag, & Push
on:
  pull_request:
    branches:
      - develop
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
jobs:
  build-develop-open:
    if: github.base_ref == 'develop' && github.event.pull_request.merged == false
    uses: kbase/.github/.github/workflows/reusable_build.yml@main
    secrets: inherit
  build-develop-merge:
    if: github.base_ref == 'develop' && github.event.pull_request.merged == true
    uses: kbase/.github/.github/workflows/reusable_build-push.yml@main
    with:
      name: '${{ github.event.repository.name }}-develop'
      tags: pr-${{ github.event.number }},latest
    secrets: inherit
  build-main-open:
    # Build only (no push) on open PRs to main/master, mirroring the
    # build-develop-open pattern. The previous push-on-open setup failed
    # because GHCR's per-package "Manage Actions access" doesn't grant the
    # GITHUB_TOKEN write rights on `ghcr.io/kbase/cdm-spark-events`. The
    # `pr-N` tag is still produced at merge time by `build-main-merge`,
    # so PR validation works without requiring a package-settings change.
    if: (github.base_ref == 'main' || github.base_ref == 'master') && github.event.pull_request.merged == false
    uses: kbase/.github/.github/workflows/reusable_build.yml@main
    secrets: inherit
  build-main-merge:
    if: (github.base_ref == 'main' || github.base_ref == 'master') && github.event.pull_request.merged == true
    uses: kbase/.github/.github/workflows/reusable_build-push.yml@main
    with:
      name: '${{ github.event.repository.name }}'
      tags: pr-${{ github.event.number }},latest-rc
    secrets: inherit
  trivy-scans:
    if: (github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'master' ) && github.event.pull_request.merged == false
    uses: kbase/.github/.github/workflows/reusable_trivy-scans.yml@main
    secrets: inherit
